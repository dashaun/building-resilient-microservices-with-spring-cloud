<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Building Resilient Microservices with Spring Cloud</title>
    <link rel="stylesheet" href="./reveal.js/dist/reset.css">
    <link rel="stylesheet" href="./reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="./reveal.js/dist/theme/simple.css">
    <link rel="stylesheet" href="./reveal.js/dist/plugin/highlight/monokai.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --spring-green: #6db33f;
            --spring-dark: #191e1e;
            --spring-text: #4a4a4a;
            --spring-heading: #111;
            --spring-border: #ebf2f2;
            --bbq-ember: #c0392b;
        }
        .reveal { font-family: 'Open Sans', sans-serif; font-size: 28px; color: var(--spring-text); line-height: 1.5; }
        .reveal .slides { border-top: 5px solid var(--spring-green); }
        .reveal h1, .reveal h2, .reveal h3 { font-family: 'Work Sans', sans-serif; color: var(--spring-heading); text-transform: none; letter-spacing: -0.02em; }
        .reveal h1 { font-size: 2.1em; }
        .reveal h2 { font-size: 1.5em; }
        .reveal h3 { font-size: 1.1em; }
        .reveal p { font-size: 0.9em; }
        .reveal ul, .reveal ol { font-size: 0.84em; }
        .reveal li { margin-bottom: 0.25em; }
        .reveal a, .reveal code { color: var(--spring-green); }
        .reveal pre { font-size: 0.5em; width: 100%; border-radius: 8px; box-shadow: 0 8px 15px rgba(0,0,0,.15); }
        .reveal pre code { max-height: 520px; padding: 18px 22px; white-space: pre-wrap; background: var(--spring-dark); border-radius: 8px; }
        .reveal table { font-size: 0.72em; }
        .reveal table th { background: var(--spring-green); color: white; padding: 10px 16px; }
        .reveal table td { padding: 8px 16px; border-bottom: 1px solid var(--spring-border); }
        .reveal blockquote { border-left: 4px solid var(--spring-green); background: #f9fdf7; padding: 12px 20px; box-shadow: none; font-style: normal; }
        .reveal section[data-background-color="#6db33f"] h1,
        .reveal section[data-background-color="#6db33f"] h2,
        .reveal section[data-background-color="#6db33f"] h3,
        .reveal section[data-background-color="#6db33f"] p { color: white; }
        .reveal section[data-background-color="#191e1e"] h1,
        .reveal section[data-background-color="#191e1e"] h2,
        .reveal section[data-background-color="#191e1e"] h3,
        .reveal section[data-background-color="#191e1e"] p { color: white; }
        .reveal section[data-background-color="#c0392b"] h1,
        .reveal section[data-background-color="#c0392b"] h2,
        .reveal section[data-background-color="#c0392b"] h3,
        .reveal section[data-background-color="#c0392b"] p { color: white; }
        .reveal .progress, .reveal .controls { color: var(--spring-green); }

        /* On colored slides a link must not inherit the body link color:
           #6db33f on #6db33f is literally invisible. */
        .reveal section[data-background-color="#6db33f"] a { color: #ffffff; text-decoration: underline; text-underline-offset: 4px; }
        .reveal section[data-background-color="#191e1e"] a { color: #a8e07a; text-decoration: underline; text-underline-offset: 4px; }
        /* Same for blockquotes: the near-white default panel + white text is unreadable. */
        .reveal section[data-background-color="#6db33f"] blockquote,
        .reveal section[data-background-color="#191e1e"] blockquote {
            background: rgba(255, 255, 255, .13);
            border-left-color: rgba(255, 255, 255, .9);
            color: #ffffff;
        }
        .reveal section[data-background-color="#6db33f"] blockquote p,
        .reveal section[data-background-color="#191e1e"] blockquote p { color: #ffffff; }

        /* ---- slide diagrams (svg.dg) ---- */
        .reveal svg.dg { display: block; margin: 0 auto; width: 100%; height: auto; max-height: 600px; font-family: 'Open Sans', sans-serif; }
        .dg text { text-anchor: middle; }
        .dg .n-app   { fill: #ffffff; stroke: var(--spring-green); stroke-width: 2.5; }
        .dg .n-plain { fill: #ffffff; stroke: #cfd8d8; stroke-width: 2; }
        .dg .n-fill  { fill: var(--spring-green); }
        .dg .n-infra { fill: #f4f8f8; stroke: #b9c6c6; stroke-width: 2; }
        .dg .n-msg   { fill: #fdf3f1; stroke: var(--bbq-ember); stroke-width: 2; }
        .dg .n-bad   { fill: #fdf0ee; stroke: var(--bbq-ember); stroke-width: 2.5; stroke-dasharray: 7 5; }
        .dg .n-warn  { fill: #fdf6ec; stroke: #d9822b; stroke-width: 2.5; }
        .dg .band    { fill: #fafcfa; stroke: #dde5e5; stroke-width: 2; stroke-dasharray: 7 6; }
        .dg .track   { fill: #f1f5f5; }
        .dg .t       { font-size: 21px;   font-weight: 700; fill: var(--spring-dark); }
        .dg .t-sm    { font-size: 17px;   font-weight: 700; fill: var(--spring-dark); }
        .dg .t-lg    { font-size: 25px;   font-weight: 700; fill: var(--spring-dark); }
        .dg .t-on    { font-size: 23px;   font-weight: 700; fill: #ffffff; }
        .dg .port    { font-size: 14px;   font-weight: 700; fill: var(--spring-green); }
        .dg .sub     { font-size: 12.5px; fill: #7b8a8a; }
        .dg .sub-on  { font-size: 13.5px; fill: #eaf5e2; }
        .dg .lbl     { font-size: 13px;   fill: #7b8a8a; }
        .dg .lbl-g   { font-size: 13px;   font-weight: 700; fill: #59942f; }
        .dg .lbl-e   { font-size: 13px;   font-weight: 700; fill: var(--bbq-ember); }
        .dg .lbl-a   { font-size: 13px;   font-weight: 700; fill: #b3701f; }
        .dg .mono    { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; fill: #7b8a8a; }
        .dg .flow    { stroke: var(--spring-green); stroke-width: 2.5; fill: none; }
        .dg .async   { stroke: var(--bbq-ember);    stroke-width: 2.5; fill: none; }
        .dg .weak    { stroke: #8fa0a0; stroke-width: 2.5; stroke-dasharray: 7 5; fill: none; }
        .dg .warn    { stroke: #d9822b; stroke-width: 2.5; fill: none; }
        .dg .thin    { stroke: #c8d2d2; stroke-width: 2; fill: none; stroke-linejoin: round; }
        .dg .start   { text-anchor: start; }
        .dg .end     { text-anchor: end; }
        /* on a green section background */
        .dg.inv .n-app   { fill: rgba(255,255,255,.15); stroke: #ffffff; }
        .dg.inv .n-plain { fill: rgba(255,255,255,.09); stroke: rgba(255,255,255,.6); }
        .dg.inv .n-msg   { fill: rgba(255,255,255,.15); stroke: #ffe2da; }
        .dg.inv .band    { fill: rgba(255,255,255,.08); stroke: rgba(255,255,255,.5); }
        .dg.inv .t, .dg.inv .t-sm, .dg.inv .t-lg { fill: #ffffff; }
        .dg.inv .port, .dg.inv .lbl-g { fill: #eaf5e2; }
        .dg.inv .sub, .dg.inv .lbl, .dg.inv .mono { fill: rgba(255,255,255,.85); }
        .dg.inv .flow  { stroke: #ffffff; }
        .dg.inv .async { stroke: #ffe2da; }
    </style>
</head>
<body>
<div class="reveal">
    <div class="slides">
        <section data-markdown="intro.md"      data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="config.md"      data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="discovery.md"   data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="resilience.md"  data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="stream.md"      data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="gateway.md"     data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="tracing.md"     data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
        <section data-markdown="outro.md"       data-separator="^\f" data-separator-vertical="^---$" data-separator-notes="^Notes:" data-charset="utf-8"></section>
    </div>
</div>
<script src="./reveal.js/dist/reveal.js"></script>
<script src="./reveal.js/dist/plugin/markdown.js"></script>
<script src="./reveal.js/dist/plugin/highlight.js"></script>
<script src="./reveal.js/dist/plugin/notes.js"></script>
<script>
    Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        progress: true,
        transition: 'slide',
        width: 1200,
        height: 800,
        margin: 0.04,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
    });
</script>
</body>
</html>
